<script>
'use strict';
// Bab 3, Kurva Valid atau Cacat. Beat ids match narration.id.json. Every curve that deforms is a function of one number
// (a shape state, set by prog() from the beat's time), so a seek and a replay give the same frame.
const CHAPTER = { number: 3, title: 'Kurva Valid atau Cacat', minutes: 8, language: 'id', next: '../ch04/' };

/* ---------- captions: the voice spells the abbreviations (ka ve pe), the caption shows them written (KVP) ---------- */
const NB = ' ';
const nb = s => s.replace(/ /g, NB);
const NUM = (words, to) => [new RegExp('\\b' + words + '\\b', 'gi'), to];
const SAY = [[/\bef i ve ce\b/gi, 'FIVC'], [/\bve e pe satu\b/gi, 'VEP1'], [/\bka ve pe\b/gi, 'KVP'], [/\bte el ce\b/gi, 'TLC'], [/\bbe e ve\b/gi, 'BEV'],
  [/\be o ef e\b/gi, 'EOFE'], [/\bef e te\b/gi, 'FET'], [/\ba te es\b/gi, 'ATS'], [/\be er es\b/gi, 'ERS'],
  NUM('seratus delapan puluh', '180'), NUM('dua ratus empat puluh', '240'), NUM('seratus lima puluh mililiter', '150' + NB + 'mL'), NUM('dua ratus mililiter', '200' + NB + 'mL'),
  NUM('dua ratus', '200'), NUM('seratus mililiter', '100' + NB + 'mL'), NUM('dua puluh lima mililiter', '25' + NB + 'mL'), NUM('sepuluh', '10'),
  NUM('lima belas detik', '15' + NB + 'detik'), NUM('enam detik', '6' + NB + 'detik'), NUM('satu detik', '1' + NB + 'detik'), NUM('satu menit', '1' + NB + 'menit'),
  NUM('dua koma sembilan satu', '2,91'), NUM('tiga koma nol sembilan liter', '3,09' + NB + 'L'), NUM('tiga koma nol lima', '3,05'), NUM('tiga koma satu dua', '3,12'),
  NUM('tiga liter', '3' + NB + 'L'), NUM('empat liter', '4' + NB + 'L'), NUM('lima persen', '5%'), NUM('tiga persen', '3%'), NUM('lima puluh', '50'),
  NUM('lima kriteria', '5 kriteria'), NUM('tiga manuver', '3 manuver'), NUM('delapan', '8'), NUM('tiga kali', '3 kali')];
for (const t of Object.values(TIMINGS)) t.cues = t.cues.map(([s, str]) => [s, SAY.reduce((a, [re, to]) => a.replace(re, to), str)]);

/* ---------- chapter drawing helpers (the same as chapters 1 and 2) ---------- */
const text = (p, str, x, y, t0, { size = 30, fill = K.ink, anchor = 'start', weight = 500, dur = .5 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0, dur); return e; };
const width = (e, str, size) => e.getComputedTextLength() || str.length * size * .56;
function runs(p, parts, x, y, t0, { size = 30, weight = 500, anchor = 'start', dur = .5 } = {}) {
  const g = G(p, { o: 0 });
  let cx = 0;
  for (const [str, fill = K.ink, wt = weight] of parts) { const e = T(g, str, { x: cx, y: 0, size, fill, weight: wt }); cx += width(e, str, size); }
  put(g, { x: anchor === 'middle' ? x - cx / 2 : anchor === 'end' ? x - cx : x, y });
  show(g, t0, dur);
  return g;
}
function pill(p, str, x, y, fill, t0, { size = 30, anchor = 'start', pad = 16, dur = .5 } = {}) {
  const g = G(p, { o: 0 });
  const t = T(g, str, { x: 0, y: 0, size, fill: '#fff', weight: 700 });
  const w = width(t, str, size) + pad * 2;
  g.insertBefore(mk('rect', { x: -pad, y: -size * .86, width: w, height: size * 1.25, rx: size * .4, fill }), t);
  put(g, { x: (anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x) + pad, y });
  show(g, t0, dur);
  return g;
}
function tag(p, str, x, y, t0, { size = 24, edge = K.ink } = {}) {
  const g = G(p, { o: 0 });
  const t = T(g, str, { x: 0, y: 0, size, weight: 600 });
  const w = width(t, str, size) + 36;
  g.insertBefore(mk('rect', { x: -18, y: -size * .92, width: w, height: size * 1.55, rx: size * .78, fill: '#fff', stroke: edge, 'stroke-width': 3 }), t);
  put(g, { x: x + 18, y }); tw(g, { o: 1 }, t0, .45);
  return g;
}
function arrowD(x1, y1, x2, y2, head = 16) {
  const a = Math.atan2(y2 - y1, x2 - x1), c = Math.cos(a), s = Math.sin(a), hw = head * .6;
  const bx = x2 - head * c, by = y2 - head * s;
  return `M${x1} ${y1}L${x2} ${y2}M${bx - hw * s} ${by + hw * c}L${x2} ${y2}L${bx + hw * s} ${by - hw * c}`;
}
function box(p, x, y, w, h, edge, { fill = '#fff', sw = 3, o = 0 } = {}) {
  const g = G(p, { x, y, o });
  mk('rect', { x: 0, y: 0, width: w, height: h, rx: 22, fill, stroke: edge, 'stroke-width': sw }, g);
  return g;
}
const lerp = (a, b, q) => a + (b - a) * q;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
function ring(p, x, y, t0, color = K.ink) {
  const g = G(p, { x, y, o: 0 }); mk('circle', { r: 16, fill: 'none', stroke: color, 'stroke-width': 5 }, g);
  prog(q => put(g, { s: 1 + 2.4 * q, o: .9 * (1 - q) }), t0, .9, out);
  return g;
}
// a solid ring that stays (marks a place on a curve)
function mark(p, x, y, t0, color = K.ink, r = 20) {
  const g = G(p, { x, y, o: 0 }); mk('circle', { r, fill: 'none', stroke: color, 'stroke-width': 5 }, g);
  tw(g, { o: 1 }, t0, .4); return g;
}
// the "ciri / dampak" card: rows { k: 'ciri', lines: [...], col, t0 } under one rounded box
function cdCard(p, x, y, w, rows, { size = 25 } = {}) {
  let hh = 16; const g = G(p, { x, y });
  const inner = rows.map(r => { const ry = hh; hh += r.lines.length * (size * 1.32) + 14; return { r, ry }; });
  const b = mk('rect', { x: 0, y: 0, width: w, height: hh + 4, rx: 18, fill: '#fff', stroke: K.faint, 'stroke-width': 3 }, g); put(b, { o: 0 }); show(b, Math.min(...rows.map(r => r.t0)) - .1, .4);
  inner.forEach(({ r, ry }) => {
    const gr = G(g, { o: 0 });
    T(gr, r.k.toUpperCase(), { x: 20, y: ry + size * .98, size: 19, fill: r.col || K.dim, weight: 700 });
    r.lines.forEach((ln, j) => {
      const yy = ry + size * .98 + j * size * 1.32;
      if (typeof ln === 'string') T(gr, ln, { x: 120, y: yy, size, fill: K.ink, weight: 500 });
      else { let cx = 120; for (const [s, f = K.ink, wt = 500] of ln) { const e = T(gr, s, { x: cx, y: yy, size, fill: f, weight: wt }); cx += width(e, s, size); } }
    });
    show(gr, r.t0, .5);
  });
  g.h = hh + 4; return g;
}
const ban = (p, str, x, y, w, t0, col = K.nnt, size = 28) => {
  const g = G(p, { o: 0, y: 20 }); mk('rect', { x, y, width: w, height: 62, rx: 18, fill: col, 'fill-opacity': .1, stroke: col, 'stroke-width': 3 }, g);
  T(g, str, { x: x + w / 2, y: y + 41, size, weight: 700, anchor: 'middle' });
  tw(g, { o: 1, y: 0 }, t0, .5, out); return g;
};

/* ---------- this chapter's meanings (on top of style.json look.meaning) ---------- */
// the curve under test: ink; a fault: gangguan red; a good curve: normal green; KVP orange; the ratio blue; cut-off Versi Paru grey.
const C_CUT = K.paru;

/* ---------- schematic flow-volume curves ---------- */
// State s: amp (peak scale), sub (0..1, a low blunt submaximal peak), scoop (0..1, the obstruction curve of chapter 2),
// cough / cx (a sharp notch at volume cx), glot (a sudden drop to zero in mid-curve), tail (a small second hump after the end),
// ext (a low flow tail running on to the right). Volume 1 is the end of the normal curve.
const FV0 = { amp: 1, sub: 0, scoop: 0, cough: 0, cx: .14, glot: 0, tail: 0, ext: 0 };
function fvF(v, s) {
  const w = Math.max(0, 1 - (v - .09) / .91);
  const base = v < .09 ? Math.sin(Math.max(v, 0) / .09 * Math.PI / 2) : w;
  let f = base;
  if (s.scoop) f = lerp(f, (v < .09 ? base : Math.pow(w, 2.4)) * .55, s.scoop);
  if (s.sub) f = lerp(f, .42 * (v < .22 ? Math.sin(Math.max(v, 0) / .22 * Math.PI / 2) : Math.max(0, 1 - (v - .22) / .78)), s.sub);
  f *= s.amp;
  if (s.cough) f *= 1 - s.cough * .72 * Math.exp(-Math.pow((v - s.cx) / .018, 2));
  if (s.glot) f *= 1 - s.glot * (smooth(.36, .375, v) - smooth(.435, .45, v));
  if (s.tail && v > .9) f += s.tail * .17 * Math.sin(Math.PI * clamp((v - 1.0) / .13)) * (v > 1 ? 1 : 0);
  if (s.ext && v > .8) f += s.ext * .08 * smooth(.8, 1, v) * (v <= 1 ? 1 : Math.max(0, 1 - (v - 1) / .4));
  return f;
}
const fvEnd = s => 1 + .4 * (s.ext || 0) + .13 * clamp((s.tail || 0) * 4);
function fvD(x0, y0, sw, sh, s) {
  const n = 150, ve = fvEnd(s); let d = '';
  for (let i = 0; i <= n; i++) { const v = ve * i / n; d += (i ? 'L' : 'M') + (x0 + v * sw).toFixed(1) + ' ' + (y0 - fvF(v, s) * sh).toFixed(1); }
  return d + `L${(x0 + ve * sw).toFixed(1)} ${y0}`;
}
function fvCurve(p, x0, y0, sw, sh, s, color, { width = 6, wash = .1, dashed = false, drawn = false } = {}) {
  const g = G(p), area = mk('path', { fill: color, 'fill-opacity': wash, stroke: 'none' }, g);
  const line = path(g, '', { stroke: color, 'stroke-width': width, 'stroke-linejoin': 'round', ...(dashed ? { 'stroke-dasharray': '10 9' } : {}) }, dashed || !drawn ? {} : { d: 0 });
  const c = { g, line, area, s: { ...FV0, ...s }, set(q) { c.s = { ...FV0, ...q }; const d = fvD(x0, y0, sw, sh, c.s); line.setAttribute('d', d); area.setAttribute('d', d + 'Z'); } };
  c.set(s); return c;
}
function fvAxes(p, x0, y0, sw, sh, { labels = true, size = 24, ext = 14, below = 0 } = {}) {
  const g = G(p);
  path(g, `M${x0} ${y0 - sh - 14}V${y0 + below}M${x0} ${y0}H${x0 + sw + ext}`, { stroke: K.faint, 'stroke-width': 3 });
  if (labels) {
    T(g, 'aliran', { x: x0 - 8, y: y0 - sh - 22, size, fill: K.dim, weight: 500 });
    T(g, 'volume', { x: x0 + sw + ext, y: y0 + size + 8 + (below ? 0 : 0), size, fill: K.dim, weight: 500, anchor: 'end' });
  }
  return g;
}
// interpolate two shape states
const mixS = (a, b, q) => { const A = { ...FV0, ...a }, B = { ...FV0, ...b }, o = {}; for (const k in FV0) o[k] = lerp(A[k], B[k], q); return o; };
function fvMorph(cv, from, to, t0, dur, ease = io) { prog(q => cv.set(mixS(from, to, q)), t0, dur, ease); }
// the inspiratory limb below the axis (for the full loop): from volume 1 back to volume -ex
function loopD(x0, y0, sw, sh, ex) {
  const n = 80; let d = '';
  for (let i = 0; i <= n; i++) { const u = i / n, v = 1 - u * (1 + ex), f = -.78 * Math.pow(Math.sin(Math.PI * u), .85) * (1 - .2 * u); d += (i ? 'L' : 'M') + (x0 + v * sw).toFixed(1) + ' ' + (y0 - f * sh).toFixed(1); }
  return d;
}

/* ---------- schematic volume-time curves ---------- */
// One flow law gives the volume over time (as chapter 2): flow = F * f(v), integrated. VN is a healthy curve, VO an obstructed one.
function lawArr(F, pw, T = 16, dt = .002) {
  const n = Math.ceil(T / dt), V = new Float32Array(n + 2); let v = .004;
  for (let i = 0; i <= n + 1; i++) { V[i] = v - .004; v = Math.min(.9999, v + F * (v < .09 ? Math.sin(v / .09 * Math.PI / 2) : Math.pow(Math.max(0, 1 - (v - .09) / .91), pw)) * dt); }
  return t => { if (t <= 0) return 0; const x = clamp(t / dt, 0, n), i = Math.floor(x); return lerp(V[i], V[i + 1], x - i); };
}
const VN = lawArr(1.8, 1), VO = lawArr(1.0, 2.3);
const VT0 = { obs: 0, d: 0, fh: 0, leak: 0, zf: 0, nose: 0, cut: 99 };
function vtV(t, s) {
  if (t <= 0) return 0;
  let v = lerp(VN(t - s.d), VO(t - s.d), s.obs);
  if (s.fh) v += s.fh * smooth(0, Math.max(s.d, .01), t);
  if (s.leak) v = lerp(v, .55 * (1 - Math.exp(-t / .45)), s.leak);
  if (s.zf < 0) v *= 1 + s.zf * .3 * smooth(.5, 7, t); else if (s.zf > 0) v += s.zf * .035 * Math.max(0, t - .4);
  if (s.nose) v += s.nose * .2 * smooth(4.4, 5.1, t);
  return v;
}
const mixV = (a, b, q) => { const A = { ...VT0, ...a }, B = { ...VT0, ...b }, o = {}; for (const k in VT0) o[k] = k === 'cut' ? B[k] : lerp(A[k], B[k], q); return o; };
// a volume-time chart: x runs over TM seconds, y over vmax (1 = the healthy KVP)
function vtChart(p, x0, y0, sw, sh, { TM = 8, vmax = 1.2, labels = true, size = 24 } = {}) {
  const X = t => x0 + t / TM * sw, Y = v => y0 - v / vmax * sh, g = G(p);
  path(g, `M${x0} ${y0 - sh - 14}V${y0}H${x0 + sw + 14}`, { stroke: K.faint, 'stroke-width': 3 });
  if (labels) {
    T(g, 'volume', { x: x0 - 8, y: y0 - sh - 22, size, fill: K.dim, weight: 500 });
    T(g, 'waktu', { x: x0 + sw + 14, y: y0 + size + 8, size, fill: K.dim, weight: 500, anchor: 'end' });
  }
  const D = (s, tEnd = TM, step = .04) => { let d = ''; const te = Math.min(tEnd, s.cut === undefined ? 99 : s.cut); const n = Math.max(2, Math.ceil(te / step)); for (let i = 0; i <= n; i++) { const t = te * i / n; d += (i ? 'L' : 'M') + X(t).toFixed(1) + ' ' + Y(vtV(t, s)).toFixed(1); } return d; };
  const curve = (s, color, { width = 6, dashed = false, wash = 0, drawn = false } = {}) => {
    const cg = G(g), area = wash ? mk('path', { fill: color, 'fill-opacity': wash, stroke: 'none' }, cg) : null;
    const attrs = { fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', ...(dashed ? { 'stroke-dasharray': '10 9' } : {}) };
    const line = drawn && !dashed ? path(cg, '', attrs, { d: 0 }) : mk('path', attrs, cg);
    const c = { g: cg, line, s: { ...VT0, ...s }, set(q, tEnd = TM) { c.s = { ...VT0, ...q }; const d = D(c.s, tEnd); line.setAttribute('d', d); if (area) area.setAttribute('d', d + `L${X(Math.min(tEnd, c.s.cut))} ${y0}Z`); } };
    c.set(s); return c;
  };
  return { g, X, Y, D, curve, x0, y0, sw, sh, TM, vmax };
}
// the ratio gauge: a track with the cut-off, a marker for VEP1/KVP (no numbers: the position only)
function gauge(p, x, y, w, t0, { label = true } = {}) {
  const g = G(p, { o: 0 }), RX = r => x + clamp((r - .4) / .65) * w;
  mk('rect', { x, y: y - 12, width: RX(.75) - x, height: 24, rx: 12, fill: K.bad, 'fill-opacity': .16 }, g);
  mk('rect', { x: RX(.75), y: y - 12, width: x + w - RX(.75), height: 24, rx: 12, fill: K.ok, 'fill-opacity': .16 }, g);
  path(g, `M${RX(.75)} ${y - 26}V${y + 26}`, { stroke: C_CUT, 'stroke-width': 4, 'stroke-dasharray': '6 5' });
  T(g, 'cut-off', { x: RX(.75), y: y + 52, size: 22, fill: C_CUT, weight: 600, anchor: 'middle' });
  if (label) T(g, 'rasio VEP1/KVP', { x, y: y - 36, size: 24, fill: K.rasio, weight: 700 });
  const mk1 = G(g, { x: x, y }); mk('path', { d: 'M0 -2L-15 -26H15Z', fill: K.rasio }, mk1); mk('circle', { r: 9, fill: K.rasio, cy: 0 }, mk1);
  const set = r => put(mk1, { x: RX(r), y });
  tw(g, { o: 1 }, t0, .5);
  return { g, set, RX };
}

/* ---------- the hesitant start: BEV by back-extrapolation, computed on the drawn curve ---------- */
// The steepest point of the curve gives a tangent; where it meets zero volume is the extrapolated time zero; the volume the
// curve has already reached at that moment is the BEV. The hesitation parameters (foot volume fh, foot length d) are solved
// once so that the two worked examples read 180 and 240 mL on a 4,00 L KVP.
function bevOf(s) {
  const dt = .002; let best = 0, bi = 1, prev = vtV(0, s);
  for (let i = 1; i < 1200; i++) { const v = vtV(i * dt, s), sl = (v - prev) / dt; if (sl > best) { best = sl; bi = i; } prev = v; }
  const tm = bi * dt, vm = vtV(tm, s), te = Math.max(0, tm - vm / best);
  return { slope: best, tm, vm, te, bev: vtV(te, s) };
}
function solveFh(d, target) { let lo = 0, hi = .3; for (let i = 0; i < 26; i++) { const mid = (lo + hi) / 2; if (bevOf({ ...VT0, d, fh: mid }).bev < target) lo = mid; else hi = mid; } return (lo + hi) / 2; }
const HES = [{ ...VT0 }, { ...VT0, d: .3, fh: solveFh(.3, .045) }, { ...VT0, d: .42, fh: solveFh(.42, .06) }];   // none, 180 mL, 240 mL of 4000 mL

/* ---------- beats ---------- */
let q1els, q2els;

const BEATS = [
  ['intro', 'Kurva Valid atau Cacat', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Spirometri · Bab 3', { x: 800, y: 190, size: 28, fill: K.dim, anchor: 'middle' });
    T(g, 'Kurva Valid atau Cacat', { x: 800, y: 290, size: 84, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const cg = G(scene, { o: 1 });
    const x0 = 560, y0 = 800, sw = 480, sh = 230;
    fvAxes(cg, x0, y0, sw, sh, { labels: false });
    const c = fvCurve(cg, x0, y0, sw, sh, {}, K.ok, { width: 7, drawn: true });
    put(c.area, { o: 0 }); show(c.area, 1.9, .8);
    draw(c.line, .7, 1.6, io);
    const dot = mk('circle', { r: 11, fill: K.ink }, cg); put(dot, { o: 0 }); show(dot, .7, .2);
    prog(q => { const v = q; put(dot, { x: x0 + v * sw, y: y0 - fvF(v, FV0) * sh }); }, .7, 1.6, io);
    hide(dot, 2.4, .3);
    text(cg, 'skematis', x0 + sw + 14, y0 + 40, 2.2, { size: 22, fill: K.dim, anchor: 'end' });
    const ok = pill(cg, 'valid', 1130, 560, K.ok, 2.4, { size: 34 });
    const bad = pill(cg, 'cacat', 1130, 560, K.bad, m('sub', 1.4), { size: 34 });
    hide(ok, m('sub', 1.2), .3);
    const r = text(scene, 'Angka spirometri hanya sebaik kurvanya.', 800, 380, m('sub'), { size: 34, fill: K.dim, anchor: 'middle' });
    prog(q => c.set({ cough: q }), m('sub', 1.0), 1.4, io);
    tw(c.line, { c_stroke: K.bad }, m('sub', 1.0), 1.4);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(cg, D - .9, .8);
  }],

  ['sebelum', 'Sebelum pasien: alat diperiksa', (m, D) => {
    const p = G(panel(0), { y: 90 });
    // three steps, left to right
    [['1', 'Uji kebocoran', 70, m('a')], ['2', 'Verifikasi volume', 560, m('b')], ['3', 'Nose clip', 1120, m('e')]].forEach(([n, s, x, t0]) => {
      const g = G(p, { x, y: 110, o: 0 }); const c = G(g, { x: 22, y: -10 }); mk('circle', { r: 22, fill: K.nnt }, c); T(c, n, { y: 9, size: 26, fill: '#fff', weight: 700, anchor: 'middle' });
      T(g, s, { x: 58, y: 0, size: 32, weight: 700 }); tw(g, { o: 1 }, t0, .5);
    });
    // 1: leak test, three limits by source
    const lk = box(p, 70, 160, 450, 330, K.faint); tw(lk, { o: 1 }, m('a', .2), .5);
    [['ATS 1994', '≤ 10', 60], ['NIOSH 2004', '≤ 20', 150], ['ACOEM 2020', '≤ 30', 240]].forEach(([src, v, y], i) => {
      const g = G(lk, { o: 0 });
      T(g, src, { x: 28, y: y + 4, size: 26, fill: K.dim, weight: 600 });
      T(g, nb(v + ' mL/menit'), { x: 422, y: y + 4, size: 32, weight: 700, anchor: 'end' });
      path(g, `M28 ${y + 36}H422`, { stroke: K.faint, 'stroke-width': 2 });
      tw(g, { o: 1 }, m('a', .8 + i * .55), .5);
    });
    text(lk, 'batas berbeda menurut sumber', 225, 312, m('a', 3.2), { size: 25, fill: K.dim, anchor: 'middle' });
    // 2: the 3 L syringe and the +-3% band

/* ---------- practice: a drawn curve in each prompt ---------- */
function figFV(s) {
  const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 560 270'); svg.setAttribute('width', '440'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Kurva aliran-volume skematis');
  const mkp = (d, a) => { const e = document.createElementNS(NS, 'path'); e.setAttribute('d', d); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const x0 = 60, y0 = 230, sw = 400, sh = 190, st = { ...FV0, ...s };
  mkp(`M${x0} ${y0 - sh - 16}V${y0}H${x0 + sw + 60}`, { fill: 'none', stroke: K.faint, 'stroke-width': 3 });
  const d = fvD(x0, y0, sw, sh, st);
  mkp(d + 'Z', { fill: K.ink, 'fill-opacity': .07, stroke: 'none' }); mkp(d, { fill: 'none', stroke: K.ink, 'stroke-width': 6, 'stroke-linejoin': 'round' });
  const t = (str, x, y, a) => { const e = document.createElementNS(NS, 'text'); e.textContent = str; e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('font-size', 20); e.setAttribute('fill', K.dim); if (a) e.setAttribute('text-anchor', a); svg.appendChild(e); };
  t('aliran', x0 - 6, y0 - sh - 24); t('volume', x0 + sw + 60, y0 + 26, 'end'); t('skematis', x0 + sw + 60, y0 + 50, 'end');
  return h('figure', '', [svg]);
}
