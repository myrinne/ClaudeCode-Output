<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenapa Kurva Berbentuk Begitu</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/spirometri.js"></script>
<script src="audio/id/timings.js"></script>
<script>
'use strict';
// Bab 2, Kenapa Kurva Berbentuk Begitu. Beat ids match narration.id.json. The airway pictures (epp, usaha, obstruksi,
// emfisema, q1, q2) are driven by one function of time (airway().drive), so a seek and a replay give the same frame.
const CHAPTER = { number: 2, title: 'Kenapa Kurva Berbentuk Begitu', minutes: 8, language: 'id', next: '../ch03/' };

/* ---------- captions: the voice spells the abbreviations (ka ve pe), the caption shows them written (KVP) ---------- */
const SAY = [[/\bes ve ce\b/gi, 'SVC'], [/\bve e pe satu\b/gi, 'VEP1'], [/\bka ve pe\b/gi, 'KVP'], [/\bte el ce\b/gi, 'TLC'], [/\bef er ce\b/gi, 'FRC'],
  [/\bte ve\b/gi, 'TV'], [/\bi ce\b/gi, 'IC'], [/\bve ce\b/gi, 'VC'], [/\ber ve\b/gi, 'RV'], [/\be pe pe\b/gi, 'EPP'], [/\bpe e ef\b/gi, 'PEF'],
  [/\ba ge de\b/gi, 'AGD'], [/\bde el ce o\b/gi, 'DLCO'], [/\ba te es\b/gi, 'ATS'], [/\be er es\b/gi, 'ERS'],
  [/\bpletismografi\b/gi, 'plethysmography'], [/\bpulse oksimetri\b/gi, 'pulse oximetry']];
for (const t of Object.values(TIMINGS)) t.cues = t.cues.map(([s, str]) => [s, SAY.reduce((a, [re, to]) => a.replace(re, to), str)]);

/* ---------- chapter drawing helpers (the same as chapter 1) ---------- */
const NB = ' ';
const nb = s => s.replace(/ /g, NB);
const text = (p, str, x, y, t0, { size = 30, fill = K.ink, anchor = 'start', weight = 500, dur = .5 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0, dur); return e; };
const width = (e, str, size) => e.getComputedTextLength() || str.length * size * .56;
function runs(p, parts, x, y, t0, { size = 30, weight = 500, anchor = 'start', dur = .5 } = {}) {
  const g = G(p, { o: 0 });
  let cx = 0;
  for (const [str, fill = K.ink, wt = weight] of parts) { const e = T(g, str, { x: cx, y: 0, size, fill, weight: wt }); cx += width(e, str, size); }
  put(g, { x: anchor === 'middle' ? x - cx / 2 : anchor === 'end' ? x - cx : x, y });
  show(g, t0, dur);
  return g;
}
function pill(p, str, x, y, fill, t0, { size = 30, anchor = 'start', pad = 16, dur = .5 } = {}) {
  const g = G(p, { o: 0 });
  const t = T(g, str, { x: 0, y: 0, size, fill: '#fff', weight: 700 });
  const w = width(t, str, size) + pad * 2;
  g.insertBefore(mk('rect', { x: -pad, y: -size * .86, width: w, height: size * 1.25, rx: size * .4, fill }), t);
  put(g, { x: (anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x) + pad, y });
  show(g, t0, dur);
  return g;
}
// an outlined chip with dark text
function tag(p, str, x, y, t0, { size = 24, edge = K.ink } = {}) {
  const g = G(p, { o: 0 });
  const t = T(g, str, { x: 0, y: 0, size, weight: 600 });
  const w = width(t, str, size) + 36;
  g.insertBefore(mk('rect', { x: -18, y: -size * .92, width: w, height: size * 1.55, rx: size * .78, fill: '#fff', stroke: edge, 'stroke-width': 3 }), t);
  put(g, { x: x + 18, y }); tw(g, { o: 1 }, t0, .45);
  return g;
}
function arrowD(x1, y1, x2, y2, head = 16) {
  const a = Math.atan2(y2 - y1, x2 - x1), c = Math.cos(a), s = Math.sin(a), hw = head * .6;
  const bx = x2 - head * c, by = y2 - head * s;
  return `M${x1} ${y1}L${x2} ${y2}M${bx - hw * s} ${by + hw * c}L${x2} ${y2}L${bx + hw * s} ${by - hw * c}`;
}
function box(p, x, y, w, h, edge, { fill = '#fff', sw = 3, o = 0 } = {}) {
  const g = G(p, { x, y, o });
  mk('rect', { x: 0, y: 0, width: w, height: h, rx: 22, fill, stroke: edge, 'stroke-width': sw }, g);
  return g;
}
const lerp = (a, b, q) => a + (b - a) * q;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
function segs(p, parts, x, y, { size = 30, weight = 500, dur = .35 } = {}) {
  const g = G(p); let cx = 0;
  for (const [str, fill = K.ink, wt = weight, t0 = 0] of parts) { const e = T(g, str, { x: cx, y: 0, size, fill, weight: wt, o: 0 }); cx += width(e, str, size); show(e, t0, dur); }
  return put(g, { x, y });
}
function ring(p, x, y, t0, color = K.ink) {
  const g = G(p, { x, y, o: 0 }); mk('circle', { r: 16, fill: 'none', stroke: color, 'stroke-width': 5 }, g);
  prog(q => put(g, { s: 1 + 2.4 * q, o: .9 * (1 - q) }), t0, .9, out);
  return g;
}

/* ---------- this chapter's meanings (on top of style.json look.meaning) ---------- */
// pleural pressure (effort) grey, elastic recoil amber, pressure inside the airway teal, the EPP purple
const C_PL = K.dim, C_RC = '#b9891b', C_IN = '#1b8a8f', C_EPP = '#7a4bc2';

/* ---------- schematic flow-volume curves (as chapter 1) ---------- */
const PAT = { normal: { w: 1, pk: 1, p: 1 }, obstruksi: { w: .93, pk: .55, p: 2.6 } };
function curveD(x0, y0, sw, sh, s) {
  const n = 56, X = v => x0 + v * sw * s.w, Y = f => y0 - f * sh * s.pk;
  let d = '';
  for (let i = 0; i <= n; i++) {
    const v = i / n, f = v < .09 ? Math.sin(v / .09 * Math.PI / 2) : Math.pow(1 - (v - .09) / .91, s.p);
    d += (i ? 'L' : 'M') + X(v).toFixed(1) + ' ' + Y(f).toFixed(1);
  }
  return d + `L${X(1).toFixed(1)} ${y0}`;
}
function curve(p, x0, y0, sw, sh, s, color, { width = 6, wash = .12, dashed = false } = {}) {
  const g = G(p), area = mk('path', { fill: color, 'fill-opacity': wash, stroke: 'none' }, g);
  const line = path(g, '', { stroke: color, 'stroke-width': width, ...(dashed ? { 'stroke-dasharray': '10 9' } : {}) }, dashed ? {} : { d: 0 });
  const c = { g, line, area, s: { ...s }, set(q) { c.s = { ...q }; const d = curveD(x0, y0, sw, sh, q); line.setAttribute('d', d); area.setAttribute('d', d + 'Z'); } };
  c.set(s);
  return c;
}
function flowAxes(p, x0, y0, sw, sh, { labels = true, size = 24 } = {}) {
  const g = G(p);
  path(g, `M${x0} ${y0 - sh - 14}V${y0}H${x0 + sw + 14}`, { stroke: K.faint, 'stroke-width': 3 });
  if (labels) {
    T(g, 'aliran', { x: x0 - 8, y: y0 - sh - 22, size, fill: K.dim, weight: 500 });
    T(g, 'volume', { x: x0 + sw + 14, y: y0 + size + 6, size, fill: K.dim, weight: 500, anchor: 'end' });
  }
  return g;
}
function morph(cv, from, to, t0, dur) {
  prog(q => cv.set({ w: lerp(from.w, to.w, q), pk: lerp(from.pk, to.pk, q), p: lerp(from.p, to.p, q) }), t0, dur, io);
}
// a flow-volume curve at a given effort e (share of the maximal peak): it follows the maximal curve's falling limb once that is lower
function effD(x0, y0, sw, sh, e) {
  const n = 72, f = v => v < .09 ? Math.sin(v / .09 * Math.PI / 2) : 1 - (v - .09) / .91;
  const h = v => (v < .09 ? Math.sin(v / .09 * Math.PI / 2) : 1 - .3 * (v - .09));
  let d = '';
  for (let i = 0; i <= n; i++) { const v = i / n; d += (i ? 'L' : 'M') + (x0 + v * sw).toFixed(1) + ' ' + (y0 - Math.min(f(v), e * h(v)) * sh).toFixed(1); }
  return d + `L${x0 + sw} ${y0}`;
}
function effCurve(p, x0, y0, sw, sh, e, color, { width = 7, wash = .1 } = {}) {
  const g = G(p), area = mk('path', { fill: color, 'fill-opacity': wash, stroke: 'none' }, g);
  const line = path(g, '', { stroke: color, 'stroke-width': width }, { d: 0 });
  const c = { g, line, area, set(q) { const d = effD(x0, y0, sw, sh, q); line.setAttribute('d', d); area.setAttribute('d', d + 'Z'); } };
  c.set(e);
  return c;
}

/* ---------- the airway: tube, pressure along it, EPP ---------- */
// x runs from the alveolus (0) to the mouth (1). The graph under the tube shows, in the same x, the pressure outside the
// airway (the pleural pressure L, dashed grey) and inside it (teal). State s:
//   pel recoil, L pleural pressure, L0 the pleural pressure the pressure profile was set at, gam how front-loaded the fall is
//   (1 = even, small = steep near the alveolus), flow (dot speed), nar narrowing of the thin airways, cl collapse of thin airways
//   beyond the EPP (0 to 1), sq squeeze beyond the EPP (0 to 1), reveal / ol / bl / br how much of the curve, outside line,
//   pleural bar and recoil bar is drawn.
// Upstream of the EPP the fall is the same whatever L is (the flow is set by the recoil); downstream the extra pressure falls
// across the squeezed segment. Schematic: no pressure values.
const THIN_END = .6;      // up to here the airways are thin-walled bronchioles, beyond it cartilaginous
const S0 = { pel: .68, L: .32, L0: .32, gam: 1, flow: 1, nar: 0, cl: 1, sq: 1, reveal: 1, ol: 1, bl: 1, br: 1 };
const epX = s => Math.pow(s.pel / (s.L0 + s.pel), 1 / s.gam);
function pIn(s, x) {
  const D = s.L0 + s.pel, c = Math.pow(x, s.gam), cs = s.pel / D;
  return x <= Math.pow(cs, 1 / s.gam) ? s.L + s.pel - D * c : s.L * (1 - (c - cs) / (1 - cs));
}
function wallH(s, x, H) {
  const def = Math.max(0, s.L - pIn(s, x));
  const thin = 1 - smooth(THIN_END - .05, THIN_END + .05, x);
  const nar = 1 - .36 * s.nar * thin * smooth(.08, .2, x);
  const sq = s.sq * (thin * s.cl * .93 * (1 - Math.exp(-def * 20)) + (1 - thin) * .32 * (1 - Math.exp(-def * 6)));
  return H * nar * (1 - sq);
}
const TOPP = 1.5;         // the graph's top, in pressure units
function airway(p, o) {
  const { X0, W, yc, y0g, U, H = 44, N = 60, R = 88 } = o;
  const px = x => X0 + x * W, py = v => y0g - v * U;
  const A = { px, py, X0, W, yc, y0g, U, H, s: { ...S0, ...(o.init || {}) } };
  A.s0 = { ...A.s };
  const g = A.g = G(p);
  path(g, `M${X0} ${py(TOPP) - 8}V${y0g}H${X0 + W + 10}`, { stroke: K.faint, 'stroke-width': 3 });
  A.gg = G(g);                                    // ghost curves
  A.washG = G(g, { o: 0 }); A.wash = mk('path', { fill: K.bad, 'fill-opacity': .16, stroke: 'none' }, A.washG);
  A.out = mk('path', { stroke: C_PL, 'stroke-width': 4, 'stroke-dasharray': '12 9', fill: 'none' }, g);
  A.inn = mk('path', { stroke: C_IN, 'stroke-width': 7, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  A.tag = G(g);
  // the stack of the two pressures at the alveolus: pleural at the bottom, recoil on top
  const sx = X0 - 32;
  A.stL = mk('rect', { x: sx, width: 24, fill: C_PL, 'fill-opacity': .5 }, g);
  A.stU = mk('rect', { x: sx, width: 24, fill: C_RC, 'fill-opacity': .6 }, g);
  A.lblL = T(g, 'tekanan pleura', { x: sx - 12, size: 24, fill: C_PL, weight: 700, anchor: 'end', o: 0 });
  A.lblU = T(g, 'recoil elastis', { x: sx - 12, size: 24, fill: C_RC, weight: 700, anchor: 'end', o: 0 });
  A.lblT = T(g, 'tekanan pendorong', { x: sx + 12, size: 26, fill: K.ink, weight: 700, anchor: 'middle', o: 0 });
  // tube
  const cx = X0 - Math.sqrt(R * R - H * H);
  A.sacP = { cx, R };
  A.sac = mk('path', { d: `M${X0} ${yc - H}A${R} ${R} 0 1 0 ${X0} ${yc + H}Z`, fill: C_IN, 'fill-opacity': 0, stroke: K.ink, 'stroke-width': 5, 'stroke-linejoin': 'round' }, g);
  A.strips = Array.from({ length: N }, () => mk('path', { fill: C_IN, 'fill-opacity': 0, stroke: 'none' }, g));
  A.wt = mk('path', { fill: 'none', stroke: K.ink, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  A.wb = mk('path', { fill: 'none', stroke: K.ink, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  A.rings = mk('path', { fill: 'none', stroke: K.ink, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
  // pleural pressure on the outside of the tube (grey arrows), recoil arrows inside the sac (amber)
  A.arG = G(g, { o: o.arrows === false ? 0 : 1 });
  A.arT = mk('path', { fill: 'none', stroke: C_PL, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, A.arG);
  A.arB = mk('path', { fill: 'none', stroke: C_PL, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, A.arG);
  A.rcG = G(g, { o: o.arrows === false ? 0 : 1 });
  A.rc = mk('path', { fill: 'none', stroke: C_RC, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, A.rcG);
  // air dots
  const M = 16;
  A.dotsG = G(g);
  A.dots = Array.from({ length: M }, (_, i) => { const e = mk('circle', { r: 6.5, fill: C_IN, 'fill-opacity': .95 }, A.dotsG); e._ph = i / M; e._ln = ((i * 0.618) % 1) * 2 - 1; return e; });
  // the EPP marker: ring on the tube, ring on the graph, dotted line, label
  A.ep = G(g, { o: o.epp === false ? 0 : 1 });
  A.eLine = mk('path', { stroke: C_EPP, 'stroke-width': 3, 'stroke-dasharray': '3 8', 'stroke-linecap': 'round', fill: 'none' }, A.ep);
  A.eRing = mk('circle', { r: 26, fill: 'none', stroke: C_EPP, 'stroke-width': 6 }, A.ep);
  A.eDot = mk('circle', { r: 14, fill: 'none', stroke: C_EPP, 'stroke-width': 5 }, A.ep);
  A.eLbl = T(A.ep, 'EPP', { size: o.eppSize || 40, fill: C_EPP, weight: 700, anchor: 'middle' });
  // axis words
  if (o.axisWords !== false) {
    T(g, 'alveolus', { x: X0 + 6, y: y0g + 36, size: 24, fill: K.dim });
    T(g, 'mulut', { x: X0 + W, y: y0g + 36, size: 24, fill: K.dim, anchor: 'end' });
    if (o.pword !== false) T(g, 'tekanan', { x: X0 + 12, y: py(TOPP) - 14, size: 24, fill: K.dim });
  }
  // thin and cartilaginous segment names above the tube
  if (o.labels) {
    const ly = yc - H - 150;
    const br = (a, b, col, str) => { const gr = G(g, { o: 0 }); path(gr, `M${px(a)} ${ly + 14}V${ly + 26}H${px(b)}V${ly + 14}`, { stroke: col, 'stroke-width': 3 }); T(gr, str, { x: (px(a) + px(b)) / 2, y: ly, size: 26, fill: col, weight: 700, anchor: 'middle' }); return gr; };
    A.segThin = br(.13, THIN_END - .01, K.dim, 'bronkiolus, dinding tipis');
    A.segCart = br(THIN_END + .01, 1, K.dim, 'saluran napas kartilaginosa');
  }
  A.ghost = (params, color, { dash = true, width = 4, label } = {}) => {
    const s = { ...S0, ...params }; let d = '';
    for (let i = 0; i <= 80; i++) { const x = i / 80; d += (i ? 'L' : 'M') + px(x).toFixed(1) + ' ' + py(pIn(s, x)).toFixed(1); }
    const e = mk('path', { d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', ...(dash ? { 'stroke-dasharray': '10 9' } : {}) }, A.gg);
    return e;
  };
  A.apply = s => {
    A.s = s;
    const h = x => wallH(s, x, H);
    // inside curve up to `reveal`
    let d = '';
    const xr = Math.max(s.reveal, .001);
    for (let i = 0; i <= 80; i++) { const x = xr * i / 80; d += (i ? 'L' : 'M') + px(x).toFixed(1) + ' ' + py(pIn(s, x)).toFixed(1); }
    A.inn.setAttribute('d', d); A.inn.setAttribute('stroke-opacity', s.reveal > .004 ? 1 : 0);
    // the part beyond the EPP where the outside pressure is the larger
    const xs = epX(s);
    let w = '';
    if (s.reveal > xs + .003) {
      w = `M${px(xs).toFixed(1)} ${py(s.L).toFixed(1)}`;
      for (let i = 0; i <= 40; i++) { const x = xs + (s.reveal - xs) * i / 40; w += `L${px(x).toFixed(1)} ${py(pIn(s, x)).toFixed(1)}`; }
      w += `L${px(s.reveal).toFixed(1)} ${py(s.L).toFixed(1)}Z`;
    }
    A.wash.setAttribute('d', w);
    A.out.setAttribute('d', `M${X0} ${py(s.L)}H${X0 + W * s.ol}`);
    // stack
    const hl = s.L * s.bl * U, hu = s.pel * s.br * U;
    A.stL.setAttribute('y', y0g - hl); A.stL.setAttribute('height', hl);
    A.stU.setAttribute('y', y0g - hl - hu); A.stU.setAttribute('height', hu);
    put(A.lblL, { y: y0g - hl / 2 + 8 }); put(A.lblU, { y: y0g - hl - hu / 2 + 8 }); put(A.lblT, { y: y0g - hl - hu - 22 });
    // tube
    let top = '', bot = '';
    for (let i = 0; i <= 60; i++) { const x = i / 60, hh = h(x); top += (i ? 'L' : 'M') + px(x).toFixed(1) + ' ' + (yc - hh).toFixed(1); bot += (i ? 'L' : 'M') + px(x).toFixed(1) + ' ' + (yc + hh).toFixed(1); }
    A.wt.setAttribute('d', top); A.wb.setAttribute('d', bot);
    const sacP = (s.L * s.bl + s.pel * s.br) / TOPP;
    A.sac.setAttribute('fill-opacity', (sacP * .62).toFixed(3));
    const n = A.strips.length;
    A.strips.forEach((e, i) => {
      const a = i / n, b = (i + 1) / n, ha = h(a), hb = h(b);
      e.setAttribute('d', `M${px(a).toFixed(1)} ${(yc - ha).toFixed(1)}L${px(b).toFixed(1)} ${(yc - hb).toFixed(1)}L${px(b).toFixed(1)} ${(yc + hb).toFixed(1)}L${px(a).toFixed(1)} ${(yc + ha).toFixed(1)}Z`);
      e.setAttribute('fill-opacity', (b <= s.reveal + .001 ? .1 + .62 * clamp(pIn(s, (a + b) / 2) / TOPP) : 0).toFixed(3));
    });
    // cartilage rings
    let rg = '';
    for (let x = THIN_END + .04; x < .99; x += .05) { const hh = h(x); rg += `M${px(x).toFixed(1)} ${(yc - hh).toFixed(1)}v-13M${px(x).toFixed(1)} ${(yc + hh).toFixed(1)}v13`; }
    A.rings.setAttribute('d', rg);
    // pleural arrows (length follows L), recoil arrows (length follows the recoil)
    const len = 22 + 80 * s.L; let at = '', ab = '';
    for (let x = .1; x < 1; x += .1) { const hh = h(x); at += arrowD(px(x), yc - hh - 12 - len, px(x), yc - hh - 12, 14); ab += arrowD(px(x), yc + hh + 12 + len, px(x), yc + hh + 12, 14); }
    A.arT.setAttribute('d', at); A.arB.setAttribute('d', ab);
    const rl = 70 * s.pel * s.br; let rc = '';
    for (const a of [-.6, 0, .6]) { const ang = Math.PI + a * .9, r0 = R - 12, r1 = Math.max(r0 - rl, 8); rc += arrowD(cx + r0 * Math.cos(ang), yc + r0 * Math.sin(ang), cx + r1 * Math.cos(ang), yc + r1 * Math.sin(ang), 13); }
    A.rc.setAttribute('d', rc);
    // EPP marker
    A.ep.style.display = '';
    put(A.eRing, {}); A.eRing.setAttribute('cx', px(xs)); A.eRing.setAttribute('cy', yc);
    A.eDot.setAttribute('cx', px(xs)); A.eDot.setAttribute('cy', py(s.L));
    A.eLine.setAttribute('d', `M${px(xs)} ${yc + 30}V${y0g + 16}`);
    put(A.eLbl, { x: px(xs), y: y0g + 74 });
  };
  // dots: position by the integral of the flow (a function of time, so a seek and a replay agree)
  A.moveDots = (c, s) => {
    A.dots.forEach(e => {
      const u = (e._ph + c * .1) % 1, hh = wallH(s, u, H);
      e.setAttribute('cx', px(u).toFixed(1)); e.setAttribute('cy', (yc + e._ln * hh * .62).toFixed(1));
    });
  };
  // plan: [[t0, dur, { key: value }], ...] in order and not overlapping; the state is a function of t
  A.drive = (plan, D) => {
    const stateAt = t => { const s = { ...A.s0 }; for (const [t0, d, to] of plan) { const q = io(clamp((t - t0) / d)), b = { ...s }; for (const k in to) s[k] = lerp(b[k], to[k], q); if (t < t0 + d) break; } return s; };
    const dt = 1 / 30, n = Math.ceil((D + 1) / dt) + 2, cum = [0];
    for (let i = 1; i < n; i++) cum.push(cum[i - 1] + stateAt(i * dt).flow * dt);
    const cumAt = t => { const f = clamp(t / dt, 0, n - 2), i = Math.floor(f); return lerp(cum[i], cum[i + 1], f - i); };
    prog(q => { const t = q * D, s = stateAt(t); A.apply(s); A.moveDots(cumAt(t), s); }, 0, D, lin);
  };
  A.apply(A.s); A.moveDots(0, A.s);
  return A;
}

/* ---------- the spirogram: volume (share of TLC) over time ---------- */
const LV = { rv: .18, frc: .42, tv: .08, tlc: 1 };
function spiro(u) {
  const cyc = (a, b, k) => LV.frc + LV.tv * (.5 - .5 * Math.cos((u - a) / (b - a) * k * 2 * Math.PI));
  if (u < .27) return cyc(0, .27, 3);
  if (u < .35) return LV.frc + (LV.tlc - LV.frc) * soft((u - .27) / .08);
  if (u < .46) return LV.tlc + (LV.rv - LV.tlc) * soft((u - .35) / .11);
  if (u < .52) return LV.rv + (LV.frc - LV.rv) * soft((u - .46) / .06);
  return cyc(.52, .60, 1);
}

/* ---------- the forced manoeuvre: one flow law gives volume over time and flow over volume ---------- */
const FM = (() => {
  const f = v => v < .09 ? Math.sin(Math.max(v, 0) / .09 * Math.PI / 2) : 1 - (v - .09) / .91;
  const F = 1.5, dt = .002, V = [], Fl = []; let v = .004;
  for (let i = 0; i <= 2500; i++) { V.push(v); Fl.push(f(v)); v = Math.min(.9999, v + F * f(v) * dt); }
  const at = (arr, t) => { const x = clamp(t / dt, 0, arr.length - 2), i = Math.floor(x); return lerp(arr[i], arr[i + 1], x - i); };
  let pk = 0; Fl.forEach((q, i) => { if (q > Fl[pk]) pk = i; });
  return { v: t => at(V, t), f: t => at(Fl, t), dt, tpk: pk * dt };
})();

      prog(q => {

        ds.forEach(e => { const u = (e._ph + c) % 1, hh = tb.H * (1 - k * .9 * Math.exp(-Math.pow((u - .36) / .09, 2))); e.setAttribute('cx', (tb.x0 + u * tb.w).toFixed(1)); e.setAttribute('cy', (tb.y + e._ln * hh * .6).toFixed(1)); });
      }, 0, D, lin);
    };
    const kPinch = t => io(clamp((t - m('b', 1.4)) / 3.0));
    flowOf(t1, () => 0, () => .13); flowOf(t2, kPinch, t => .13 * (1 - .65 * kPinch(t)));
    const sq = G(p, { o: 0 }), qx = t2.x0 + t2.w * .36;
    path(sq, arrowD(qx, t2.y - t2.H - 62, qx, t2.y - t2.H - 14, 14), { stroke: C_PL, 'stroke-width': 5 });
    path(sq, arrowD(qx, t2.y + t2.H + 62, qx, t2.y + t2.H + 14, 14), { stroke: C_PL, 'stroke-width': 5 });
    tw(sq, { o: 1 }, m('b', 2.0), .6);
    text(p, 'kolaps dinamis, lebih awal', qx, t2.y + t2.H + 112, m('b', 3.4), { size: 28, fill: K.bad, weight: 700, anchor: 'middle' });
    const ban = G(p, { o: 0, y: 20 }); mk('rect', { x: 140, y: 812, width: 1320, height: 62, rx: 18, fill: K.nnt, 'fill-opacity': .1, stroke: K.nnt, 'stroke-width': 3 }, ban);
    T(ban, 'Membandingkan SVC dan KVP bukan aturan administratif: itu cerminan mekanika paru', { x: 800, y: 853, size: 30, weight: 700, anchor: 'middle' });
    tw(ban, { o: 1, y: 0 }, m('d', .4), .5, out);
  }],

  ['wrap', 'Ringkasan', (m) => {
    const p = panel(0);
    const items = [
      [[[['Spirometri mengukur '], ['ventilasi', K.ink], ['. Volume residu tidak terukur,']], [['jadi '], ['TLC', K.dim], [' dan '], ['FRC', K.dim], [' juga tidak.']]], 'w1'],
      [[[['Di '], ['EPP', C_EPP], [', tekanan di dalam saluran napas sama']], [['dengan tekanan di luar (pleura).']]], 'w2'],
      [[[['Awal kurva '], ['bergantung usaha', C_PL], [', bagian akhir '], ['tidak', C_RC], ['.']]], 'w3'],
      [[[['Obstruksi: '], ['EPP', C_EPP], [' bergeser ke arah alveolus, kurva cekung.']], [['Emfisema: recoil turun. Asma, bronkitis: resistensi naik.']]], 'w4'],
    ];
    let y = 190;
    items.forEach(([lines, mark], idx) => {
      const g = G(p, { x: -16, y, o: 0 });
      const c = G(g, { x: 150, y: -12, s: .3 }); mk('circle', { r: 28, fill: K.nnt }, c); T(c, String(idx + 1), { y: 11, size: 32, fill: '#fff', weight: 700, anchor: 'middle' });
      tw(c, { s: 1 }, m(mark), .5, back);
      let maxx = 0;
      lines.forEach((ln, j) => {
        let cx = 210;
        ln.forEach(([s, f]) => { const e = T(g, s, { x: cx, y: j * 46, size: 35, weight: f ? 700 : 600, fill: f || K.ink }); cx += width(e, s, 35); });
        maxx = Math.max(maxx, cx);
      });
      const nxt = items[idx + 1] ? m(items[idx + 1][1]) : m('end');
      draw(path(g, `M210 ${(lines.length - 1) * 46 + 16}H${maxx}`, { stroke: K.nnt, 'stroke-width': 3, 'stroke-opacity': .5 }, { d: 0 }), m(mark) + .4, Math.max(.8, nxt - m(mark) - .8), lin);
      tw(g, { o: 1, x: 0 }, m(mark), .6, out);
      y += 60 + lines.length * 46 + 36;
    });
  }],

  ['final1', 'Latihan bab', () => { panel(0); }, { ask: done => quiz(SCREEN, PRACTICE, done, 'Latihan bab') }],
  ['finish', 'Selesai', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- practice ---------- */
const PRACTICE = [

      'Volume residu tidak pernah keluar dari paru, jadi spirometer tidak melihatnya. TLC dan FRC ikut tidak terukur.',
      ['Kapasitas vital dihembuskan dari paru penuh sampai habis: terukur.', 'Volume tidal adalah napas biasa: terukur.', '', 'Kapasitas inspirasi dihirup dari akhir napas biasa: terukur.']) },
  { id: 'p-letak', prompt: ['Pada paru sehat, di mana EPP tercapai?'],
    build: choice(['Di alveolus', 'Di bronkiolus berdinding tipis', 'Di saluran napas kartilaginosa', 'Di mulut'], 2,
      'Pada paru sehat tekanan turun bertahap, jadi EPP tercapai di saluran napas kartilaginosa.',

  { id: 'p-usaha', prompt: ['Pasien menambah usaha di pertengahan ekspirasi. Apa yang terjadi pada aliran?'],

      ['Itu hanya berlaku di bagian awal, dekat PEF. Setelah EPP terbentuk, usaha tambahan tidak menambah aliran.', '', 'Aliran tidak turun karena usaha: ia tetap ditentukan recoil elastis dan resistensi.', 'Aliran tidak berhenti. Ia hanya tidak bertambah.']) },
  { id: 'p-mekanisme', prompt: ['Pilih mekanisme utama tiap penyakit. Keduanya menggeser EPP ke arah alveolus.'],
    build: grid([
      { parts: ['Emfisema'], ans: ['r'], why: 'Jaringan elastis rusak, recoil turun, tekanan pendorong lebih kecil.' },
      { parts: ['Asma atau bronkitis'], ans: ['s'], why: 'Lumen menyempit, resistensi naik, tekanan turun lebih curam.' },
    ], [['r', 'Recoil turun'], ['s', 'Resistensi naik']], { multi: false, text: true }) },
];
